[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuimux"
version = "0.3.0"
description = "A terminal dashboard to open, reach, and keep-awake tmux sessions across your Tailscale tailnet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Ersilia Open Source Initiative" }]
keywords = ["tmux", "tailscale", "ssh", "terminal", "tui", "textual"]
dependencies = ["textual==8.2.8", "rich==15.0.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
tuimux = "tuimux.cli:main"

[project.urls]
Homepage = "https://github.com/ersilia-os/tuimux"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tuimux = ["engine.sh"]
